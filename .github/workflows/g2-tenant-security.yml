name: G2 tenant security proof

on:
  pull_request:
  push:

jobs:
  postgres-rls:
    name: PostgreSQL ${{ matrix.postgres-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ['15', '16', '17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: dawineks_hospitality_os
      DB_USERNAME: dawineks_runtime
      DB_PASSWORD: g2-ci-runtime-only
      G2_DB_DATABASE: dawineks_hospitality_os
      G2_ADMIN_DB_USERNAME: postgres
      G2_ADMIN_DB_PASSWORD: postgres
      TENANT_MEMBERSHIP_TABLE: identity.account_memberships
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql, pgsql
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create least-privilege roles and database
        run: psql -v ON_ERROR_STOP=1 -d postgres -f database/security/g2-ci-bootstrap.sql

      - name: Provision identity security schema as administrator
        run: psql -v ON_ERROR_STOP=1 -d dawineks_hospitality_os -f database/security/identity-security-bootstrap.sql

      - name: Allow the dedicated migrator to create the migration repository
        run: psql -v ON_ERROR_STOP=1 -d dawineks_hospitality_os -c "GRANT CREATE ON SCHEMA public TO dawineks_migrator"

      - name: Run identity migrations with the separate migration login
        run: DB_CONNECTION=pgsql DB_USERNAME=dawineks_migrator DB_PASSWORD=g2-ci-migrator-only php artisan migrate --force

      - name: Verify identity security immediately after migrations
        run: psql -v ON_ERROR_STOP=1 -d dawineks_hospitality_os -f database/security/assert-identity-rls.sql

      - name: Revoke temporary migration repository creation privilege
        run: psql -v ON_ERROR_STOP=1 -d dawineks_hospitality_os -c "REVOKE CREATE ON SCHEMA public FROM dawineks_migrator"

      - name: Install isolated RLS proof fixture
        run: psql -v ON_ERROR_STOP=1 -d dawineks_hospitality_os -f database/security/g2-proof-fixtures.sql

      - name: Seed the CI-only tenant context signing key
        run: echo "TENANT_CONTEXT_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Insert the ephemeral CI-only tenant context signing key
        run: >-
          psql -v ON_ERROR_STOP=1 -d dawineks_hospitality_os
          -c "INSERT INTO security.context_keys (key_id, key_material, is_active)
          VALUES ('ci-active', decode('${TENANT_CONTEXT_KEY}', 'hex'), true)"

      - name: Install CI-only identity grants and membership fixtures
        run: psql -v ON_ERROR_STOP=1 -d dawineks_hospitality_os -f database/security/g2-identity-ci-install.sql

      - name: Enforce tenant table policy coverage
        run: psql -v ON_ERROR_STOP=1 -d dawineks_hospitality_os -f database/security/assert-tenant-rls.sql

      - name: Generate an ephemeral Laravel test encryption key
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Test tenant isolation under the runtime login
        run: |
          set +e
          php artisan test --compact --no-ansi tests/Feature > "$RUNNER_TEMP/g2-feature-tests.log" 2>&1
          test_status=$?
          cat "$RUNNER_TEMP/g2-feature-tests.log"
          if [ "$test_status" -ne 0 ]; then
            failure_summary=$(tail -n 20 "$RUNNER_TEMP/g2-feature-tests.log" | tr '\n' ' ')
            echo "::error title=G2 feature test output::$failure_summary"
          fi
          exit "$test_status"
